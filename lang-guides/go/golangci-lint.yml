# Reference golangci-lint v2 configuration.
# Copy to .golangci.yml in your project root and adjust as needed.
#
# Migration from v1: run `golangci-lint migrate`
# New in v2: `linters.default` replaces `enable-all`/`disable-all`

version: "2"

linters:
  default: standard
  enable:
    - gosec
    - gocyclo
    - revive
    - gocritic

  settings:
    gocyclo:
      min-complexity: 15
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

  exclusions:
    presets:
      - comment
      - std-error-handling
    paths:
      - third_party
      - ".*_test\\.go"
    rules:
      - linters:
          - gocritic
        text: "commentFormatting"

output:
  formats:
    text:
      color: true

formatters:
  enable:
    - gofmt
    - goimports
