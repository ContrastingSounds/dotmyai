# Reference GitHub Actions CI workflow for Go projects.
# Copy to .github/workflows/ci.yml and adjust as needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11904086
      - uses: actions/setup-go@0aaccfd
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733
        with:
          version: v2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11904086
      - uses: actions/setup-go@0aaccfd
        with:
          go-version-file: go.mod
      - run: go test -race -cover -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@ea165f8
        with:
          name: coverage
          path: coverage.out

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11904086
      - uses: actions/setup-go@0aaccfd
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  generate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11904086
      - uses: actions/setup-go@0aaccfd
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - run: git diff --exit-code

  # Uncomment for tag-based releases:
